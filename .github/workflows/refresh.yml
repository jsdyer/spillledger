name: Refresh published records
on:
  schedule:
    - cron: '41 10 4 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/refresh.py', 'scripts/source_io.py', 'scripts/requirements.txt', 'sources/**', '.github/workflows/refresh.yml']
permissions:
  contents: read
concurrency:
  group: refresh-edition
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r scripts/requirements.txt
      - run: python3 scripts/refresh.py
      - run: python3 -m unittest discover -s tests
      - run: node --test tests/*.test.mjs
      - run: python3 scripts/build.py
      - name: Publish validated records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet -- web/data; then
            git add web/data
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh source records'
            git push origin HEAD:main
            gh workflow run pages.yml --ref main
          elif [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
            gh workflow run pages.yml --ref main
          fi
